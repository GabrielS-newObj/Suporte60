plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

// CORREÇÃO: lê a chave da Gemini do local.properties (arquivo que já está
// no .gitignore, então a chave nunca vai pro Git) e expõe como
// BuildConfig.GEMINI_API_KEY para o AssistenteIA.java poder usar.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def geminiApiKey = localProperties.getProperty('GEMINI_API_KEY', '')

// CORREÇÃO: mesmas credenciais do Cloudinary lidas do local.properties (não
// vai pro Git), expostas como BuildConfig para CloudinaryUploader.java usar.
// Ver instruções completas nos comentários de CloudinaryUploader.java.
def cloudinaryCloudName = localProperties.getProperty('CLOUDINARY_CLOUD_NAME', '')
def cloudinaryUploadPreset = localProperties.getProperty('CLOUDINARY_UPLOAD_PRESET', '')

// SEGURANÇA: o build "server" NÃO embute mais e-mail/senha de admin no APK.
// O atendente entra pela tela LoginAtendenteActivity (e-mail + senha de uma
// conta individual do Firebase Authentication) e o Firebase mantém a sessão
// no aparelho. As permissões de atendente ficam no banco, em
// admins/{uid} = true (ver database.rules.json). As linhas ADMIN_EMAIL e
// ADMIN_SENHA do local.properties não são mais usadas e podem ser apagadas.

android {
    namespace = "com.florian.suporte60"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.florian.suporte60"
        minSdk = 30 //check InitialSplashScreen before update
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey}\""
        buildConfigField "String", "CLOUDINARY_CLOUD_NAME", "\"${cloudinaryCloudName}\""
        buildConfigField "String", "CLOUDINARY_UPLOAD_PRESET", "\"${cloudinaryUploadPreset}\""
    }

    buildFeatures {
        resValues = true
        buildConfig = true
    }

    flavorDimensions += "tipo"

    productFlavors {
        // Versão do Cliente (será publicada na rede/Play Store)
        client {
            dimension "tipo"
            applicationId = "com.florian.suporte60.client"
            resValue "string", "app_name", "Suporte 60+"
        }

        // Versão do Servidor/Atendente (uso exclusivo no seu aparelho)
        server {
            dimension "tipo"
            applicationId = "com.florian.suporte60.server"
            resValue "string", "app_name", "Suporte 60+ (Admin)"
        }
    }
    // ---------------------------------------


    buildTypes {
        release {
            optimization {
                enable = false
            }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity
    implementation(libs.activity.ktx)
    implementation(libs.appcompat)
    implementation(libs.constraintlayout)
    implementation(libs.material)
    testImplementation(libs.junit)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    androidTestImplementation(libs.espresso.core)
    androidTestImplementation(libs.ext.junit)
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    // CORREÇÃO: firebase-storage removido (exige plano Blaze) — áudio agora
    // sobe direto pro Cloudinary via OkHttp, ver CloudinaryUploader.java.
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("androidx.core:core-splashscreen:1.0.1")
    implementation("com.google.android.material:material:1.11.0")
    implementation 'androidx.activity:activity:1.8.0'
    implementation(platform("com.google.firebase:firebase-bom:34.18.0"))
    implementation("com.google.firebase:firebase-analytics")
}